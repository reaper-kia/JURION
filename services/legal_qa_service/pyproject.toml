[project]
name = "jurion-legal-qa"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["grpcio>=1.83.0", "grpcio-health-checking>=1.83.0", "protobuf>=7.35.1", "jurion-platform-contracts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["legal_qa*"]

[tool.uv.sources]
jurion-platform-contracts = { path = "../../packages/platform_contracts", editable = true }
